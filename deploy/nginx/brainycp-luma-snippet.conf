# Luma CMS — BrainyCP / pure nginx snippet for stage.bsc.cv.ua
# Paste into BOTH HTTP and HTTPS server blocks (replace the generic location / rewrite).
# Adjust root and fastcgi_pass to match your panel values.

# root /home/bsc/sites/bsc.cv.ua/stage;
# fastcgi_pass unix:/var/run/php-fpm/php84w-bsc.sock;

location ~ ^/(apps|deploy|docs|packages|plugins)/ {
    deny all;
}

location = /studio {
    return 301 /admin/;
}

location ^~ /studio/ {
    return 301 /admin/;
}

# Luma Studio SPA (built with VITE_BASE_PATH=/admin/)
# Without this block, /admin/setup hits root index.php and breaks install redirects.
location ^~ /admin/ {
    alias /home/bsc/sites/bsc.cv.ua/stage/apps/studio/dist/;
    index index.html;
    try_files $uri $uri/ /admin/index.html;
}

# Wrong: rewrite ^(.+)$ /index.php?q=$1  (breaks /admin/* and causes /admin/install.php)

# Laravel API + public routes (/api/, /p/, sitemap, etc.)
location ^~ /api/ {
    try_files $uri /index.php?$query_string;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Keep your existing location ~ \.php$ block, but ensure SCRIPT_FILENAME uses $document_root:
# fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

# Correct installer URLs (install.php is at site root, NOT under /admin/):
#   https://stage.bsc.cv.ua/
#   https://stage.bsc.cv.ua/install.php
#   https://stage.bsc.cv.ua/admin/setup   (after nginx /admin/ block is active)
