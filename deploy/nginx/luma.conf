# Luma CMS — shared hosting nginx sample
# Point root to apps/api/public and alias Luma Studio static files at /admin/.

server {
    listen 80;
    server_name example.com;
    client_max_body_size 64M;

    root /var/www/luma/apps/api/public;
    index index.php index.html;

    location /admin/ {
        alias /var/www/luma/apps/studio/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin {
        return 301 /admin/;
    }

    location /studio {
        return 301 /admin/;
    }

    location /studio/ {
        return 301 /admin/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
